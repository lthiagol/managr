# The layer tree.
#
# `[[layer]]` declares a layer and the key that enters it from the root.
# `[[item]]` declares one action inside a layer.
#
# The `key` here is the overlay's OWN keyspace. It is not a Herdr binding and
# cannot collide with one, because the overlay is modal: while it is open it
# takes every keystroke. The Herdr chord is looked up from your live keymap
# and shown for reference; it is not what you press.
#
# `keep = true` leaves the overlay open after the action runs. That is right
# for repeatable verbs (moving focus) and wrong for one-shots (split, close),
# so the default is to close.
#
# `value` supplies a fixed argument, e.g. the digit for a 1-9 switch.
#
# An action with no executor is rendered as a hint row: the overlay shows the
# Herdr chord and tells you to press it yourself. That is how Herdr's own UI
# surfaces (settings, the session navigator, detach) are handled, because they
# have no socket method.

reference_key = "?"

# The key that opens the navigatr: the session, drawn as a tree.
#
# It is a setting and not a constant, so a user who wants it somewhere
# else moves it here. The root lists it, so the key is discoverable.
#
# A layer that binds this key keeps it -- the layer's own binding wins,
# exactly like the filter's key -- and then the navigatr is not reachable
# by it, and the root does not list an entry that would promise it is.
#
# It is one character: the overlay's keyspace is single characters, so a
# key of two characters could never be pressed, and the root would not
# list it either.
navigatr_key = "j"

# The key that opens the agents list: every agent in the session, the ones
# that want attention first.
#
# It is a setting for the same reason the navigatr's key is one, and it
# follows the same rules: a key another entry in the root already has is
# not listed, and neither is a key of more than one character.
agents_key = "a"

# -- layers -----------------------------------------------------------------

[[layer]]
id = "nav"
key = "n"
title = "navigation"
hint = "move focus between panes, spaces, tabs and agents"

[[layer]]
id = "panes"
key = "p"
title = "panes"
hint = "split, close, zoom, resize and rename"

[[layer]]
id = "spaces"
key = "w"
title = "workspaces"
hint = "create, rename, close and switch"

[[layer]]
id = "tabs"
key = "t"
title = "tabs"
hint = "create, rename, close, switch and reorder"

[[layer]]
id = "session"
key = "s"
title = "session"
hint = "config, notifications, and what Herdr keeps for itself"

# The custom layer is the odd one out: its rows are not in this file. They
# are the user's own `[[keys.command]]` entries and the actions of every
# installed plugin, and they are fetched when the layer is opened.
#
# The key is the overlay's own: "c" is free in the root, which binds n, p,
# w, t, s, the navigatr's key, the agents list's key and the reference
# key.
[[layer]]
id = "custom"
key = "c"
title = "custom"
hint = "your own commands, and the actions of every plugin"

