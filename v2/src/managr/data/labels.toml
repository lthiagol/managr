# Human labels for Herdr actions.
#
# Wording deliberately mirrors Herdr's own vocabulary (the `prefix+?` panel and
# the docs) so the bar reads the same as the rest of the UI. Anything missing
# here falls back to `action.replace("_", " ")` and raises a warning, which is
# the signal that Herdr grew an action this build does not know yet.

